name: tests

# Both suites are synthetic end-to-end regressions -- they build their own waveforms and
# touch no real data, which is exactly what makes them runnable here.
#
# This repo is the base of the stack and depends on nothing else, so CI here needs no
# cross-repo checkout and no secrets.  The downstream repos are the ones that do.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg   # no display on the runner; plotting must not open a window

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Record the environment under test
        run: python -c "import numpy,h5py,matplotlib as m;print('numpy',numpy.__version__);print('h5py',h5py.__version__);print('matplotlib',m.__version__)"

      - name: hodoscope_common (output_paths)
        run: python hodoscope_common/tests/test_output_paths.py

      - name: hodoscope_common (declip)
        run: python hodoscope_common/tests/test_declip.py

      - name: file_manipulation
        run: python file_manipulation/tests/test_file_manipulation.py
